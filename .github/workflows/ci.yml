name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scale_files:
        description: Number of generated files in the native Linux scale fixture
        type: choice
        default: '100000'
        options: ['100000', '1000000']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            experiments/sqlite/go.sum
      - run: ./scripts/tasks check
      - name: Exact pre-extension schema-14 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          repository: bjornarhagen/saga-rydd
          ref: 733deb60d31d9eb5d11cbc663505c4c166c210ab
          path: .local/ci-cpu-preextension-733
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Native pre-extension CLI refuses CPU-session state
        timeout-minutes: 5
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -o pipefail
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) legacy_target=linux-amd64 ;;
            macOS:ARM64) legacy_target=darwin-arm64 ;;
            macOS:X64) legacy_target=darwin-amd64 ;;
            *) echo 'Unsupported native pre-extension fixture runner profile' >&2; exit 1 ;;
          esac
          legacy_source="$GITHUB_WORKSPACE/.local/ci-cpu-preextension-733"
          legacy_output="$GITHUB_WORKSPACE/dist/ci-cpu-preextension"
          legacy_binary="$legacy_output/rydd-$legacy_target"
          test "$(git -C "$legacy_source" rev-parse --verify HEAD)" = '733deb60d31d9eb5d11cbc663505c4c166c210ab'
          test -z "$(git -C "$legacy_source" status --porcelain=v1 --untracked-files=all)"
          cmp "$legacy_source/go.mod" go.mod
          cmp "$legacy_source/go.sum" go.sum
          test ! -e "$legacy_output"
          test ! -L "$legacy_output"
          mkdir -m 700 "$legacy_output"
          (cd "$legacy_source" && go build -mod=readonly -buildvcs=true -trimpath -o "$legacy_binary" ./cmd/rydd)
          test -z "$(git -C "$legacy_source" status --porcelain=v1 --untracked-files=all)"
          cmp "$legacy_source/go.mod" go.mod
          cmp "$legacy_source/go.sum" go.sum
          export RYDD_CPU_CHARGES_OLD_CLI="$legacy_binary"
          "$legacy_binary" --json --version > "$legacy_output/version.json"
          RYDD_OLD_CLI_EXPECT_TARGET="$legacy_target" python3 - <<'PY_VERSION'
          import hashlib, json, os, stat
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          old_source = root / '.local/ci-cpu-preextension-733'
          output = root / 'dist/ci-cpu-preextension'
          with (output / 'version.json').open('rb') as stream:
              version_bytes = stream.read(16385)
          assert 0 < len(version_bytes) <= 16384
          reply = json.loads(version_bytes)
          assert reply['api_version'] == 1 and reply['ok'] is True and reply['command'] == 'version'
          metadata = reply['build_metadata']
          assert metadata['contract'] == 'build_metadata_v1' and metadata['go_version'] == 'go1.27.1'
          assert (metadata['goos'], metadata['goarch']) == tuple(os.environ['RYDD_OLD_CLI_EXPECT_TARGET'].split('-'))
          assert metadata['revision'] == '733deb60d31d9eb5d11cbc663505c4c166c210ab' and metadata['source_status'] == 'clean'
          expected = {
              'go.mod': '535237cb86a470feb6ac97f6aeae2b0347524727e3a959415b81baeebc530c32',
              'go.sum': '7ef33c2fca1509bae82eb62fa01bc626b5e6e45b999834b364459c0e5a917e80',
              'internal/state/schema.go': '862b0f0a9ed8ad0942cbcba5e72fccfe8478015f172ed1c9574784a07e6f0097',
          }
          for name, digest in expected.items():
              with (old_source / name).open('rb') as stream:
                  body = stream.read(65537)
              assert len(body) <= 65536 and hashlib.sha256(body).hexdigest() == digest
          binary = Path(os.environ['RYDD_CPU_CHARGES_OLD_CLI'])
          fd = os.open(binary, os.O_RDONLY | os.O_NOFOLLOW)
          try:
              before = os.fstat(fd)
              assert binary.is_absolute() and stat.S_ISREG(before.st_mode) and before.st_nlink == 1
              assert before.st_mode & 0o111 and 0 < before.st_size <= 64 * 1024 * 1024
              digest = hashlib.sha256()
              remaining = before.st_size
              while remaining:
                  block = os.read(fd, min(1024 * 1024, remaining))
                  assert block
                  digest.update(block)
                  remaining -= len(block)
              assert not os.read(fd, 1)
              def signature(value):
                  return (value.st_dev, value.st_ino, value.st_mode, value.st_nlink, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
              assert signature(before) == signature(os.fstat(fd)) == signature(binary.lstat())
          finally:
              os.close(fd)
          receipt = {
              'contract': 'native_preextension_cli_fixture_v1',
              'source_revision': '733deb60d31d9eb5d11cbc663505c4c166c210ab',
              'source_schema': 14,
              'source_files_sha256': expected,
              'binary_sha256': digest.hexdigest(),
              'binary_bytes': before.st_size,
              'binary_device': before.st_dev,
              'binary_inode': before.st_ino,
              'declared_build_metadata': metadata,
              'source_authentication_verified': False,
              'binary_reproduction_claimed': False,
          }
          with (output / 'build-receipt.json').open('x') as stream:
              json.dump(receipt, stream, sort_keys=True)
              print(file=stream)
          print(json.dumps(receipt, sort_keys=True))
          PY_VERSION
          go test -json -mod=readonly -timeout=2m ./internal/state -run '^TestCPUChargesOldCLIRefusesActivatedStore$' -count=1 | tee "$legacy_output/test.jsonl"
          python3 - <<'PY_RESULT'
          import json, os
          from pathlib import Path
          with (Path(os.environ['GITHUB_WORKSPACE']) / 'dist/ci-cpu-preextension/test.jsonl').open('rb') as stream:
              body = stream.read(1048577)
          assert 0 < len(body) <= 1048576
          lines = body.splitlines()
          assert len(lines) <= 128 and all(0 < len(line) <= 65536 for line in lines)
          records = [json.loads(line) for line in lines]
          selected = [record for record in records if record.get('Test') == 'TestCPUChargesOldCLIRefusesActivatedStore']
          assert sum(record['Action'] == 'run' for record in selected) == 1
          assert sum(record['Action'] == 'pass' for record in selected) == 1
          assert not any(record['Action'] in ('skip', 'fail') for record in selected)
          assert any(record.get('Action') == 'pass' and 'Test' not in record for record in records)
          print('Exact pre-extension native CLI fixture ran and passed; no skip accepted.')
          PY_RESULT
      - name: Exact pre-period schema-15 source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        timeout-minutes: 2
        with:
          repository: bjornarhagen/saga-rydd
          ref: fa64338f9675654bd2430b41e6e512b8faf00ddd
          path: .local/ci-cpu-preperiod-fa
          fetch-depth: 1
          fetch-tags: false
          submodules: false
          lfs: false
          persist-credentials: false
      - name: Native pre-period CLI refuses CPU-period state
        timeout-minutes: 5
        env:
          GOTOOLCHAIN: local
          GOPROXY: 'off'
          GOSUMDB: 'off'
        run: |
          set -o pipefail
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) legacy_target=linux-amd64 ;;
            macOS:ARM64) legacy_target=darwin-arm64 ;;
            macOS:X64) legacy_target=darwin-amd64 ;;
            *) echo 'Unsupported native pre-period fixture runner profile' >&2; exit 1 ;;
          esac
          legacy_source="$GITHUB_WORKSPACE/.local/ci-cpu-preperiod-fa"
          legacy_output="$GITHUB_WORKSPACE/dist/ci-cpu-preperiod"
          legacy_binary="$legacy_output/rydd-$legacy_target"
          test "$(git -C "$legacy_source" rev-parse --verify HEAD)" = 'fa64338f9675654bd2430b41e6e512b8faf00ddd'
          test -z "$(git -C "$legacy_source" status --porcelain=v1 --untracked-files=all)"
          cmp "$legacy_source/go.mod" go.mod
          cmp "$legacy_source/go.sum" go.sum
          test ! -e "$legacy_output"
          test ! -L "$legacy_output"
          mkdir -m 700 "$legacy_output"
          (cd "$legacy_source" && go build -mod=readonly -buildvcs=true -trimpath -o "$legacy_binary" ./cmd/rydd)
          test -z "$(git -C "$legacy_source" status --porcelain=v1 --untracked-files=all)"
          cmp "$legacy_source/go.mod" go.mod
          cmp "$legacy_source/go.sum" go.sum
          export RYDD_CPU_ADMISSION_OLD_CLI="$legacy_binary"
          "$legacy_binary" --json --version > "$legacy_output/version.json"
          RYDD_OLD_CLI_EXPECT_TARGET="$legacy_target" python3 - <<'PY_VERSION'
          import hashlib, json, os, stat
          from pathlib import Path
          root = Path(os.environ['GITHUB_WORKSPACE'])
          old_source = root / '.local/ci-cpu-preperiod-fa'
          output = root / 'dist/ci-cpu-preperiod'
          with (output / 'version.json').open('rb') as stream:
              version_bytes = stream.read(16385)
          assert 0 < len(version_bytes) <= 16384
          reply = json.loads(version_bytes)
          assert reply['api_version'] == 1 and reply['ok'] is True and reply['command'] == 'version'
          metadata = reply['build_metadata']
          assert metadata['contract'] == 'build_metadata_v1' and metadata['go_version'] == 'go1.27.1'
          assert (metadata['goos'], metadata['goarch']) == tuple(os.environ['RYDD_OLD_CLI_EXPECT_TARGET'].split('-'))
          assert metadata['revision'] == 'fa64338f9675654bd2430b41e6e512b8faf00ddd' and metadata['source_status'] == 'clean'
          expected = {
              'go.mod': '535237cb86a470feb6ac97f6aeae2b0347524727e3a959415b81baeebc530c32',
              'go.sum': '7ef33c2fca1509bae82eb62fa01bc626b5e6e45b999834b364459c0e5a917e80',
              'internal/state/schema.go': 'ecb368fda106b87c67c59c28cefc4032c5cd0aa4d933afc94ab010bfe50e4a78',
          }
          for name, digest in expected.items():
              with (old_source / name).open('rb') as stream:
                  body = stream.read(65537)
              assert len(body) <= 65536 and hashlib.sha256(body).hexdigest() == digest
          binary = Path(os.environ['RYDD_CPU_ADMISSION_OLD_CLI'])
          fd = os.open(binary, os.O_RDONLY | os.O_NOFOLLOW)
          try:
              before = os.fstat(fd)
              assert binary.is_absolute() and stat.S_ISREG(before.st_mode) and before.st_nlink == 1
              assert before.st_mode & 0o111 and 0 < before.st_size <= 64 * 1024 * 1024
              digest = hashlib.sha256()
              remaining = before.st_size
              while remaining:
                  block = os.read(fd, min(1024 * 1024, remaining))
                  assert block
                  digest.update(block)
                  remaining -= len(block)
              assert not os.read(fd, 1)
              def signature(value):
                  return (value.st_dev, value.st_ino, value.st_mode, value.st_nlink, value.st_size, value.st_mtime_ns, value.st_ctime_ns)
              assert signature(before) == signature(os.fstat(fd)) == signature(binary.lstat())
          finally:
              os.close(fd)
          receipt = {
              'contract': 'native_preperiod_cli_fixture_v1',
              'source_revision': 'fa64338f9675654bd2430b41e6e512b8faf00ddd',
              'source_schema': 15,
              'source_files_sha256': expected,
              'binary_sha256': digest.hexdigest(),
              'binary_bytes': before.st_size,
              'binary_device': before.st_dev,
              'binary_inode': before.st_ino,
              'declared_build_metadata': metadata,
              'source_authentication_verified': False,
              'binary_reproduction_claimed': False,
          }
          with (output / 'build-receipt.json').open('x') as stream:
              json.dump(receipt, stream, sort_keys=True)
              print(file=stream)
          print(json.dumps(receipt, sort_keys=True))
          PY_VERSION
          go test -json -mod=readonly -timeout=2m ./internal/state -run '^TestCPUChargeAdmissionOldSchema15CLIRefusesActivatedStore$' -count=1 | tee "$legacy_output/test.jsonl"
          python3 - <<'PY_RESULT'
          import json, os
          from pathlib import Path
          with (Path(os.environ['GITHUB_WORKSPACE']) / 'dist/ci-cpu-preperiod/test.jsonl').open('rb') as stream:
              body = stream.read(1048577)
          assert 0 < len(body) <= 1048576
          lines = body.splitlines()
          assert len(lines) <= 128 and all(0 < len(line) <= 65536 for line in lines)
          records = [json.loads(line) for line in lines]
          selected = [record for record in records if record.get('Test') == 'TestCPUChargeAdmissionOldSchema15CLIRefusesActivatedStore']
          assert sum(record['Action'] == 'run' for record in selected) == 1
          assert sum(record['Action'] == 'pass' for record in selected) == 1
          assert not any(record['Action'] in ('skip', 'fail') for record in selected)
          assert any(record.get('Action') == 'pass' and 'Test' not in record for record in records)
          print('Exact pre-period native CLI fixture ran and passed; no skip accepted.')
          PY_RESULT
      - name: Generated duplicate acceptance and qualified native clone support
        run: go test ./internal/cli -run '^TestDuplicateGateCLI' -count=1 -v
      - name: Disposable existing-tool Go cache compatibility
        env:
          RYDD_TEST_GO_CACHE_TOOL: '1'
        run: go test ./internal/state -run '^TestGoBuildCacheToolProduced$' -count=1 -v
      - name: Disposable existing-tool Cargo layout compatibility
        run: |
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) cargo_tool_triple=x86_64-unknown-linux-gnu ;;
            macOS:ARM64) cargo_tool_triple=aarch64-apple-darwin ;;
            macOS:X64) cargo_tool_triple=x86_64-apple-darwin ;;
            *) echo 'Unsupported native Cargo fixture runner profile' >&2; exit 1 ;;
          esac
          cargo_tool_root="${RUSTUP_HOME:-${HOME}/.rustup}"
          cargo_tool_bin="$cargo_tool_root/toolchains/stable-$cargo_tool_triple/bin"
          RYDD_TEST_CARGO_TOOL=1 RYDD_TEST_CARGO_BIN="$cargo_tool_bin/cargo" RYDD_TEST_RUSTC_BIN="$cargo_tool_bin/rustc" \
            go test ./internal/state -run '^TestCargoBuildOutputToolProduced$' -count=1 -v
      - name: Main-module race package coverage census
        run: ./scripts/tasks race-census
      - name: Native no-overwrite rename and directory-sync probe
        run: go test ./experiments/rename -count=1 -v
      - name: Isolated Linux bind-mount boundary
        if: runner.os == 'Linux'
        run: |
          go test -c -o dist/inventory.test ./internal/inventory
          sudo unshare --mount --propagation private env RYDD_TEST_MOUNTS=1 ./dist/inventory.test '-test.run=^(TestBindMountBoundary(FileSamples|FullHash|FullHashStore|FullHashConsented)?|TestBindMountHashKeeperChoiceMetadata|TestBindMountBoundaryFreshHashConsented)$' -test.v
      - run: ./scripts/tasks sqlite-check
      - run: ./scripts/tasks sqlite-bench -rows 100000
      - name: Native CLI smoke check
        run: |
          ./dist/rydd --help
          ./dist/rydd --version
          ./scripts/worker-smoke ./dist/rydd
          ./scripts/scanner-smoke ./dist/rydd
          ./scripts/candidates-smoke ./dist/rydd
          ./scripts/manual-scan-smoke ./dist/rydd
      - name: Finite generated background-resource measurements
        run: |
          go build -trimpath -o dist/backgroundresources ./experiments/backgroundresources
          for resource_profile in defaults_no_power short_fixture; do
            ./dist/backgroundresources -binary ./dist/rydd -profile "$resource_profile" -seconds 30 -roots 2 -files-per-root 64 > "dist/backgroundresources-$resource_profile.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for profile in ('defaults_no_power', 'short_fixture'):
              measured = json.loads(Path(f'dist/backgroundresources-{profile}.json').read_text())
              assert measured['contract'] == 'generated_background_resources_v1'
              assert measured['generated_bodies_unchanged'] and measured['paused_progress_unchanged']
              assert measured['resume_acknowledged'] and measured['worker_graceful_exit_reaped']
              assert measured['physical_read_bytes'] is None and measured['system_wakeups'] is None
              assert measured['hourly_target_accepted'] is False and measured['physical_power_accepted'] is False
              kernel_io = measured['worker_kernel_io']
              assert kernel_io['contract'] == 'linux_proc_io_samples_v1'
              assert kernel_io['scope'] == 'owned_worker_process_and_waited_children'
              assert kernel_io['full_lifetime'] is False and kernel_io['atomic_snapshot'] is False
              if measured['platform'].startswith('linux/'):
                  assert kernel_io['observed_samples'] >= 2
                  assert kernel_io['sampled_delta'] is not None
                  assert kernel_io['gaps'] is False
              else:
                  assert kernel_io['status'] == 'unsupported'
                  assert kernel_io['observed_samples'] == 0 and kernel_io['sampled_delta'] is None
              print(json.dumps({key: measured[key] for key in ('platform', 'profile', 'requested_seconds', 'worker_full_lifetime_usage', 'worker_kernel_io', 'sampled_peak_database_bytes', 'sampled_peak_wal_bytes', 'command_latencies', 'final_saved_summary')}))
          PY

  native-race:
    name: Native races (${{ matrix.os }} / ${{ matrix.group }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        group: [cli, inventory, state, worker, supporting]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            experiments/sqlite/go.sum
      - name: Exact main-module race group
        run: ./scripts/tasks race-group '${{ matrix.group }}'

  candidate-package:
    name: Native candidate packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generated four-target archives and native version agreement
        run: |
          export GOCACHE="$(go env GOCACHE)"
          export GOMODCACHE="$(go env GOMODCACHE)"
          go mod download
          RYDD_PACKAGE_BUILD_TEST=1 go test -race -timeout=15m ./internal/buildmetadata ./internal/packaging -count=1 -v
      - name: Production candidate command and exact generated native archive
        run: |
          export GOCACHE="$(go env GOCACHE)"
          export GOMODCACHE="$(go env GOMODCACHE)"
          ./scripts/tasks package ci-fixture-v1
          (cd dist/candidates/ci-fixture-v1 && shasum -a 256 -c SHA256SUMS)
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) package_target=linux-amd64 ;;
            macOS:ARM64) package_target=darwin-arm64 ;;
            macOS:X64) package_target=darwin-amd64 ;;
            *) echo 'Unsupported native package fixture runner profile' >&2; exit 1 ;;
          esac
          mkdir dist/package-native
          tar -xzf "dist/candidates/ci-fixture-v1/rydd-ci-fixture-v1-$package_target.tar.gz" -C dist/package-native
          test "$(./dist/package-native/rydd --version)" = 'rydd ci-fixture-v1 (experimental inventory)'
          ./dist/package-native/rydd --json --version > dist/package-native/version.json
          RYDD_PACKAGE_EXPECT_TARGET="$package_target" python3 - <<'PY'
          import json, os
          from pathlib import Path
          reply = json.loads(Path('dist/package-native/version.json').read_text())
          assert reply['api_version'] == 1 and reply['ok'] is True and reply['command'] == 'version'
          assert reply['version'] == 'ci-fixture-v1'
          metadata = reply['build_metadata']
          assert metadata['contract'] == 'build_metadata_v1' and metadata['version'] == reply['version']
          assert metadata['version_source'] == 'linked_value' and metadata['executable_label_verified'] is True
          assert (metadata['goos'], metadata['goarch']) == tuple(os.environ['RYDD_PACKAGE_EXPECT_TARGET'].split('-'))
          assert metadata['go_version'] == 'go1.27.1' and metadata['cgo_enabled'] is False
          PY

  compact-scale:
    name: Native Linux compact scale fixture
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scale_files == '1000000' && 60 || 30 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Production CLI scan, crash recovery and repeated retirement
        env:
          SCALE_FILES: ${{ inputs.scale_files || '100000' }}
        run: |
          set -o pipefail
          mkdir -p dist
          go build -trimpath -o dist/rydd ./cmd/rydd
          go build -trimpath -o dist/compactscale ./experiments/compactscale
          ./dist/compactscale -binary ./dist/rydd -files "$SCALE_FILES" -cycles 2 | tee dist/compactscale.json

  docker:
    name: Docker workflow and cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: ./scripts/dev check
      - run: ./scripts/dev build-all
      - name: Verify Linux host output ownership and executable
        run: |
          test "$(stat -c %u dist/rydd)" = "$(id -u)"
          ./dist/rydd-linux-amd64 --help
          ./scripts/worker-smoke ./dist/rydd-linux-amd64
          ./scripts/scanner-smoke ./dist/rydd-linux-amd64
          ./scripts/candidates-smoke ./dist/rydd-linux-amd64
          ./scripts/manual-scan-smoke ./dist/rydd-linux-amd64
