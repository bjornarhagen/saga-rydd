name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      scale_files:
        description: Number of generated files in the native Linux scale fixture
        type: choice
        default: '100000'
        options: ['100000', '1000000']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            experiments/sqlite/go.sum
      - run: ./scripts/tasks check
      - name: Generated duplicate acceptance and qualified native clone support
        run: go test ./internal/cli -run '^TestDuplicateGateCLI' -count=1 -v
      - name: Disposable existing-tool Go cache compatibility
        env:
          RYDD_TEST_GO_CACHE_TOOL: '1'
        run: go test ./internal/state -run '^TestGoBuildCacheToolProduced$' -count=1 -v
      - name: Disposable existing-tool Cargo layout compatibility
        run: |
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) cargo_tool_triple=x86_64-unknown-linux-gnu ;;
            macOS:ARM64) cargo_tool_triple=aarch64-apple-darwin ;;
            macOS:X64) cargo_tool_triple=x86_64-apple-darwin ;;
            *) echo 'Unsupported native Cargo fixture runner profile' >&2; exit 1 ;;
          esac
          cargo_tool_root="${RUSTUP_HOME:-${HOME}/.rustup}"
          cargo_tool_bin="$cargo_tool_root/toolchains/stable-$cargo_tool_triple/bin"
          RYDD_TEST_CARGO_TOOL=1 RYDD_TEST_CARGO_BIN="$cargo_tool_bin/cargo" RYDD_TEST_RUSTC_BIN="$cargo_tool_bin/rustc" \
            go test ./internal/state -run '^TestCargoBuildOutputToolProduced$' -count=1 -v
      - run: ./scripts/tasks race
      - name: Native no-overwrite rename and directory-sync probe
        run: go test ./experiments/rename -count=1 -v
      - name: Isolated Linux bind-mount boundary
        if: runner.os == 'Linux'
        run: |
          go test -c -o dist/inventory.test ./internal/inventory
          sudo unshare --mount --propagation private env RYDD_TEST_MOUNTS=1 ./dist/inventory.test '-test.run=^(TestBindMountBoundary(FileSamples|FullHash|FullHashStore|FullHashConsented)?|TestBindMountHashKeeperChoiceMetadata|TestBindMountBoundaryFreshHashConsented)$' -test.v
      - run: ./scripts/tasks sqlite-check
      - run: ./scripts/tasks sqlite-bench -rows 100000
      - name: Native CLI smoke check
        run: |
          ./dist/rydd --help
          ./dist/rydd --version
          ./scripts/worker-smoke ./dist/rydd
          ./scripts/scanner-smoke ./dist/rydd
          ./scripts/candidates-smoke ./dist/rydd
          ./scripts/manual-scan-smoke ./dist/rydd
      - name: Finite generated background-resource measurements
        run: |
          go build -trimpath -o dist/backgroundresources ./experiments/backgroundresources
          for resource_profile in defaults_no_power short_fixture; do
            ./dist/backgroundresources -binary ./dist/rydd -profile "$resource_profile" -seconds 30 -roots 2 -files-per-root 64 > "dist/backgroundresources-$resource_profile.json"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          for profile in ('defaults_no_power', 'short_fixture'):
              measured = json.loads(Path(f'dist/backgroundresources-{profile}.json').read_text())
              assert measured['contract'] == 'generated_background_resources_v1'
              assert measured['generated_bodies_unchanged'] and measured['paused_progress_unchanged']
              assert measured['resume_acknowledged'] and measured['worker_graceful_exit_reaped']
              assert measured['physical_read_bytes'] is None and measured['system_wakeups'] is None
              assert measured['hourly_target_accepted'] is False and measured['physical_power_accepted'] is False
              print(json.dumps({key: measured[key] for key in ('platform', 'profile', 'requested_seconds', 'worker_full_lifetime_usage', 'sampled_peak_database_bytes', 'sampled_peak_wal_bytes', 'command_latencies', 'final_saved_summary')}))
          PY

  candidate-package:
    name: Native candidate packages (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Generated four-target archives and native version agreement
        run: |
          export GOCACHE="$(go env GOCACHE)"
          export GOMODCACHE="$(go env GOMODCACHE)"
          go mod download
          RYDD_PACKAGE_BUILD_TEST=1 go test -race -timeout=15m ./internal/buildmetadata ./internal/packaging -count=1 -v
      - name: Production candidate command and exact generated native archive
        run: |
          export GOCACHE="$(go env GOCACHE)"
          export GOMODCACHE="$(go env GOMODCACHE)"
          ./scripts/tasks package ci-fixture-v1
          (cd dist/candidates/ci-fixture-v1 && shasum -a 256 -c SHA256SUMS)
          case "$RUNNER_OS:$RUNNER_ARCH" in
            Linux:X64) package_target=linux-amd64 ;;
            macOS:ARM64) package_target=darwin-arm64 ;;
            macOS:X64) package_target=darwin-amd64 ;;
            *) echo 'Unsupported native package fixture runner profile' >&2; exit 1 ;;
          esac
          mkdir dist/package-native
          tar -xzf "dist/candidates/ci-fixture-v1/rydd-ci-fixture-v1-$package_target.tar.gz" -C dist/package-native
          test "$(./dist/package-native/rydd --version)" = 'rydd ci-fixture-v1 (experimental inventory)'
          ./dist/package-native/rydd --json --version > dist/package-native/version.json
          RYDD_PACKAGE_EXPECT_TARGET="$package_target" python3 - <<'PY'
          import json, os
          from pathlib import Path
          reply = json.loads(Path('dist/package-native/version.json').read_text())
          assert reply['api_version'] == 1 and reply['ok'] is True and reply['command'] == 'version'
          assert reply['version'] == 'ci-fixture-v1'
          metadata = reply['build_metadata']
          assert metadata['contract'] == 'build_metadata_v1' and metadata['version'] == reply['version']
          assert metadata['version_source'] == 'linked_value' and metadata['executable_label_verified'] is True
          assert (metadata['goos'], metadata['goarch']) == tuple(os.environ['RYDD_PACKAGE_EXPECT_TARGET'].split('-'))
          assert metadata['go_version'] == 'go1.27.1' and metadata['cgo_enabled'] is False
          PY

  compact-scale:
    name: Native Linux compact scale fixture
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.scale_files == '1000000' && 60 || 30 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Production CLI scan, crash recovery and repeated retirement
        env:
          SCALE_FILES: ${{ inputs.scale_files || '100000' }}
        run: |
          set -o pipefail
          mkdir -p dist
          go build -trimpath -o dist/rydd ./cmd/rydd
          go build -trimpath -o dist/compactscale ./experiments/compactscale
          ./dist/compactscale -binary ./dist/rydd -files "$SCALE_FILES" -cycles 2 | tee dist/compactscale.json

  docker:
    name: Docker workflow and cross-builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - run: ./scripts/dev check
      - run: ./scripts/dev build-all
      - name: Verify Linux host output ownership and executable
        run: |
          test "$(stat -c %u dist/rydd)" = "$(id -u)"
          ./dist/rydd-linux-amd64 --help
          ./scripts/worker-smoke ./dist/rydd-linux-amd64
          ./scripts/scanner-smoke ./dist/rydd-linux-amd64
          ./scripts/candidates-smoke ./dist/rydd-linux-amd64
          ./scripts/manual-scan-smoke ./dist/rydd-linux-amd64
