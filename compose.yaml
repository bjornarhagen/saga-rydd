name: saga-rydd-dev

services:
  dev:
    build: .
    user: "${RYDD_DEV_UID:-1000}:${RYDD_DEV_GID:-1000}"
    init: true
    working_dir: /workspace
    environment:
      GOCACHE: /cache/build/${RYDD_DEV_UID:-1000}
      GOMODCACHE: /cache/modules/${RYDD_DEV_UID:-1000}
    volumes:
      - .:/workspace
      - go-cache:/cache
    cpus: 2.0
    mem_limit: 2g
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  go-cache:
